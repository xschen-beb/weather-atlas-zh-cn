name: Fetch Suzhou climate data
on:
  push:
    branches: [climate-data-fetch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve Suzhou station metadata
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, math
          for name in ['ghcnd-stations.txt','ghcnd-inventory.txt']:
              urllib.request.urlretrieve('https://noaa-ghcn-pds.s3.amazonaws.com/'+name, name)
          lines=open('ghcnd-stations.txt',encoding='ascii',errors='ignore').read().splitlines()
          print('MATCH_58349')
          for x in lines:
              if '58349' in x: print(x)
          print('MATCH_SUZHOU')
          for x in lines:
              if 'SUZHOU' in x.upper(): print(x)
          print('NEAREST_TO_31.4_120.6')
          cand=[]
          for x in lines:
              if not x.startswith('CH'): continue
              try:
                  lat=float(x[12:20]); lon=float(x[21:30])
              except: continue
              dist=((lat-31.4)**2 + ((lon-120.6)*math.cos(math.radians(31.4)))**2)**.5
              cand.append((dist,x))
          for _,x in sorted(cand)[:20]: print(x)
          print('INVENTORY_58349_OR_NEAREST_IDS')
          ids=[x[:11] for _,x in sorted(cand)[:20]]
          for x in open('ghcnd-inventory.txt',encoding='ascii',errors='ignore'):
              if x[:11] in ids or '58349' in x: print(x.rstrip())
          PY
