name: Resolve Suzhou ISD station
on:
  push:
    branches: [climate-data-fetch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search NOAA ISD station history
        shell: bash
        run: |
          python - <<'PY'
          import csv, urllib.request, math
          urls=[
            'https://www.ncei.noaa.gov/pub/data/noaa/isd-history.csv',
            'https://www.ncei.noaa.gov/pub/data/noaa/isd-history.txt'
          ]
          for url in urls:
            try:
              fn=url.rsplit('/',1)[1]
              urllib.request.urlretrieve(url,fn)
              print('DOWNLOADED',url,fn)
            except Exception as e: print('FAIL',url,repr(e))
          rows=[]
          try:
            with open('isd-history.csv',encoding='utf-8-sig',errors='ignore',newline='') as f:
              r=csv.DictReader(f)
              print('FIELDS',r.fieldnames)
              for row in r: rows.append(row)
          except Exception as e: print('CSV_PARSE_FAIL',repr(e))
          print('MATCH_58349_OR_SUZHOU')
          for r in rows:
            text=' '.join(str(v) for v in r.values()).upper()
            if '58349' in text or 'SUZHOU' in text or 'SOOCHOW' in text:
              print(r)
          print('NEAREST_31.4_120.6')
          cand=[]
          for r in rows:
            try:
              lat=float(r.get('LAT','')); lon=float(r.get('LON',''))
            except: continue
            dist=((lat-31.4)**2+((lon-120.6)*math.cos(math.radians(31.4)))**2)**.5
            if dist<2.5: cand.append((dist,r))
          for dist,r in sorted(cand)[:50]: print(round(dist,4),r)
          PY
