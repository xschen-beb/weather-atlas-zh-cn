name: Map browser check
on:
  push:
    branches: [main]
    paths: ['dist/**', 'localization/**', 'scripts/verify_browser.cjs', 'scripts/verify_auth_browser.cjs', 'scripts/verify_climate_transport.mjs', '.github/workflows/map-browser-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Chinese display fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check data and Chinese presentation
        run: node scripts/verify.mjs && node scripts/verify_zh.mjs && node scripts/verify_climate_transport.mjs
      - name: Check authenticated climate requests
        run: node scripts/verify_auth_browser.cjs
      - name: Run WebGL browser checks
        run: node scripts/verify_browser.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-browser-evidence
          path: browser-evidence/
          retention-days: 30
