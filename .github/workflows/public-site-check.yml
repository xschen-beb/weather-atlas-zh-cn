name: Public site check
on:
  push:
    branches: [main]
    paths: ['scripts/verify_public_site.cjs', '.github/workflows/public-site-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Chinese display fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify public production site without sign-in
        run: node scripts/verify_public_site.cjs
      - name: Preserve public site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-evidence
          path: public-site-evidence/
          retention-days: 30
