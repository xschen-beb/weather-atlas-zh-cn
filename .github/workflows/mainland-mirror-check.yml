name: Mainland mirror check
on:
  push:
    branches: [main]
    paths: ['dist/**', 'active-manifest.json', 'localization/atlas-lite.*', 'localization/atlas-forecast.js', 'localization/atlas-data.js', 'localization/atlas-terrain.js', 'localization/atlas-basemap.js', 'localization/maps/*.json.gz', 'scripts/build_water_mask.py', 'scripts/build_mainland_mirror.py', 'scripts/embed_atlas_startup.py', 'scripts/verify_mainland_mirror.cjs', 'scripts/fixtures/basemap-shenzhen.pbf', '.github/workflows/mainland-mirror-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_BACKUP_REVISION: df85fc877f4f29b9715eba58d553f29ca861c28d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build_mainland_mirror.py mainland-dist --backup-revision "$ATLAS_BACKUP_REVISION"
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: node scripts/verify_mainland_mirror.cjs mainland-dist
      - uses: actions/upload-artifact@v4
        with:
          name: mainland-mirror-evidence
          path: mainland-evidence/
          retention-days: 30
