<script type="module">
  const notice = document.getElementById("status");
  const label = document.getElementById("statusText");
  const retry = document.createElement("button");
  retry.type = "button";
  retry.className = "chip";
  retry.style.pointerEvents = "auto";
  retry.textContent = "重试启动";
  retry.onclick = () => location.reload();

  function showFailure(message) {
    notice.classList.remove("hidden");
    notice.classList.add("error");
    notice.querySelector(".spinner")?.classList.add("hidden");
    label.textContent = message;
    if (!retry.isConnected) notice.append(retry);
  }

  async function startAtlas() {
    const external = () => import("./assets/index-zh-CN-local-2abab6d80c17.js");
    const packed = document.getElementById("atlas-startup-code");
    if (!globalThis.DecompressionStream) return external();
    let url;
    try {
      const bytes = Uint8Array.from(atob(packed.textContent.trim()), c => c.charCodeAt(0));
      const source = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const code = await new Response(source).arrayBuffer();
      if (code.byteLength !== Number(packed.dataset.bytes)) throw new Error("Incomplete startup bundle");
      url = URL.createObjectURL(new Blob([code], {type:"text/javascript"}));
    } catch {
      return external();
    }
    try {
      await import(url);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  notice.classList.remove("hidden");
  label.textContent = "正在启动地图…";
  const timer = setTimeout(() => showFailure("地图启动超时，请重试。"), 15000);
  try {
    await startAtlas();
    if (retry.isConnected) {
      retry.remove();
      if (label.textContent === "地图启动超时，请重试。") {
        notice.classList.remove("error");
        notice.querySelector(".spinner")?.classList.remove("hidden");
        label.textContent = "正在加载地图…";
      }
    }
  } catch (error) {
    console.error(error);
    showFailure("地图启动失败，请重试。");
  } finally {
    clearTimeout(timer);
  }
</script>

.atlas-lite, .atlas-lite body { min-height: 100%; height: auto; overflow: auto; background: #eef2ee; }
.atlas-lite [hidden] { display: none !important; }
.lite-shell { color: #202e29; max-width: 1450px; margin: auto; padding: 24px; }
.lite-header, .lite-map-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lite-header { margin: 0 0 20px; flex-wrap: wrap; }
.lite-header h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
.lite-header span, .lite-kicker { color: #2e5b4c; font-size: 13px; font-weight: 650; }
.lite-header span { padding: 5px 10px; background: #dcece3; border-radius: 6px; }
.lite-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lite-surface { background: #fff; border: 1px solid #d8e2dc; padding: 18px; border-radius: 14px; min-width: 0; }
.lite-surface h2 { margin: 0; font-size: 20px; }
.lite-switch { display: flex; gap: 4px; }
.lite-modes { margin-top: 12px; }
.lite-shell button, .lite-shell select { border: 1px solid #bdcec5; background: #fff; border-radius: 6px; color: inherit; cursor: pointer; font: inherit; padding: 6px 10px; }
.lite-shell button[aria-pressed=true] { background: #225a47; border-color: #225a47; color: #fff; }
.lite-shell button:focus-visible, .lite-shell input:focus-visible, .lite-shell select:focus-visible, .lite-table:focus-visible { outline: 2px solid #22775d; outline-offset: 2px; }
.lite-search { position: relative; margin: 14px 0; }
.lite-search label { display: block; font-weight: 600; margin: 0 0 5px; }
.lite-search input { border: 1px solid #bdcec5; border-radius: 6px; padding: 9px 11px; color: inherit; font: inherit; width: 100%; box-sizing: border-box; }
.lite-search p, .lite-map-hint, .lite-place-meta, .lite-detail-status { font-size: 13px; color: #495b51; margin: 8px 0 0; line-height: 1.5; }
.lite-search p:empty, .lite-detail-status:empty { display: none; }
.lite-matches { position: absolute; z-index: 1; width: 100%; max-height: 280px; overflow: auto; box-sizing: border-box; list-style: none; padding: 4px; margin: 4px 0; background: white; border: 1px solid #bdcec5; border-radius: 8px; box-shadow: 0 6px 18px #29453822; }
.lite-matches button { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; width: 100%; border: 0; text-align: left; }
.lite-matches button:hover { background: #eaf5ef; }
.lite-matches small { color: #495b51; }
.lite-map-frame { border-radius: 9px; border: 1px solid #d3e2e0; overflow: hidden; background: #eff6f5; }
.lite-map { display: block; width: 100%; height: clamp(255px, 50vh, 560px); cursor: crosshair; }
.lite-map path, .lite-map circle { vector-effect: non-scaling-stroke; }
.lite-map path { fill: none; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.lite-coast { stroke: #779895; stroke-width: 0.75; }
.lite-outline { stroke: #24584c; stroke-width: 1.35; }
.lite-maritime-dashes { stroke: #24584c; stroke-width: 1.6; }
.lite-dot { fill: #2d6658; stroke: #fff; stroke-width: 1; cursor: pointer; }
.lite-dot:hover, .lite-dot:focus { stroke: #1b6252; stroke-width: 4; }
.lite-pin { fill: #df673a; stroke: #fff; stroke-width: 2; pointer-events: none; }
.lite-kicker { margin: 0 0 8px; }
.lite-preset { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.lite-preset select:disabled { opacity: .6; cursor: default; }
.lite-retry { margin-top: 8px; }
.lite-detail { margin-top: 12px; }
.lite-detail .chart { max-width: 520px; }
.lite-detail .note { color: #495b51; }
.lite-table { overflow-x: auto; }
.lite-table table.normals.heat { min-width: 420px; font-size: 12px; }
@media (max-width: 820px) {
  .lite-layout { grid-template-columns: 1fr; }
  .lite-shell { padding: 14px; }
  .lite-surface { padding: 14px; }
}

  <body>
    <div id="map" aria-label="天气与气候地图"></div>

    <header class="topbar">
      <nav class="modes glass" id="modes" role="tablist" aria-label="地图模式">
        <button role="tab" data-mode="climate" aria-selected="true">气候筛选</button>
        <button role="tab" data-mode="live" aria-selected="false">实时天气（联网）</button>
      </nav>
      <div class="tools">
        <div class="search glass">
          <input id="search" type="search" placeholder="搜索城市（中文或英文）" autocomplete="off" aria-label="搜索城市（中文或英文）" />
          <ul id="searchResults" class="search-results" role="listbox"></ul>
        </div>
        <button id="units" class="glass icon-btn" title="切换公制与英制单位" aria-label="切换公制与英制单位">°C</button>
        <button id="globe" class="glass icon-btn" title="切换地球视图" aria-label="切换地球视图">🌐</button>
      </div>
    </header>

    <aside id="panel" class="panel glass" aria-label="筛选与图层控制"></aside>
    <button id="panelToggle" class="panel-toggle glass" aria-label="显示控制面板">☰ 控制面板</button>

    <div id="bottombar" class="bottombar glass hidden"></div>
    <div id="legend" class="legend glass"></div>
    <div id="card" class="card glass hidden" role="dialog" aria-live="polite"></div>
    <div id="status" class="status glass hidden"><span class="spinner"></span><span id="statusText"></span></div>

  </body>
